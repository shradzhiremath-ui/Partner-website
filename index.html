<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #333;
      text-align: center;
      padding: 40px;
    }

    header {
      padding: 20px;
      background: #0d0d0d;
      color: white;
      margin-bottom: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6rem;
    }

    .back-btn {
      margin-top: 20px;
      padding: 12px 25px;
      background: #0077ff;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    .back-btn:hover {
      background: #005bd1;
    }
  </style>
</head>
<body>
  <header>
    <h2>Partner Site</h2>
  </header>

  <div class="container">
    <h1>Welcome to Our Partner Website</h1>
    <p>You were redirected here from the main ecommerce landing page. This page can contain additional information, promotions, links, or anything else you want to show to your visitors.</p>

    <button class="back-btn" onclick="window.location.href='index.html'">Go Back to Main Site</button>
  </div>
</body>
</html>
